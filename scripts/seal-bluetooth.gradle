import java.security.MessageDigest
import java.security.SecureRandom
import java.util.zip.GZIPOutputStream
import javax.crypto.Cipher
import javax.crypto.spec.GCMParameterSpec
import javax.crypto.spec.SecretKeySpec

// Packaging protection, not a secret key service. Generate a local per-build master;
// its split runtime representation is still recoverable. Never publish generated outputs.
def isCommon = project.name == 'common'
def gocDirectory = providers.environmentVariable('DIPLAY_GOC_ASSETS_DIR').orNull
def input = isCommon ? file('src/main/bluetooth/manage.sh') :
    (gocDirectory ? new File(gocDirectory, 'e01-goc/gocsdk-spp-uuid128-v2') : null)
def asset = isCommon ? 'e01-goc/manage.enc' : 'e01-goc/component.enc'
def notice = !isCommon && gocDirectory ? new File(gocDirectory, 'e01-goc/NOTICE.txt') : null
def generated = layout.buildDirectory.dir('generated/sealedBluetoothAssets')
def keyFile = rootProject.layout.projectDirectory.file('common/build/generated/sealedBluetoothKey/key.bin').asFile
def keySource = rootProject.layout.projectDirectory.dir('common/build/generated/sealedBluetoothJava').asFile
def seal = tasks.register('sealBluetoothAssets') {
    if (input != null) inputs.file(input)
    if (notice != null && notice.isFile()) inputs.file(notice)
    inputs.property('asset', asset)
    inputs.property('present', input != null)
    outputs.dir(generated)
    if (isCommon) {
        outputs.file(keyFile)
        outputs.dir(keySource)
    } else {
        dependsOn(':common:sealBluetoothAssets')
        inputs.file(keyFile)
    }
    doLast {
        def destination = new File(generated.get().asFile, asset)
        destination.parentFile.mkdirs()
        if (input == null) {
            // A source-only build must never reuse an earlier provisioned binary.
            destination.delete()
            new File(destination.parentFile, 'NOTICE.txt').delete()
            return
        }
        if (notice != null && notice.isFile()) new File(destination.parentFile, 'NOTICE.txt').bytes = notice.bytes
        byte[] master
        if (isCommon) {
            master = new byte[32]
            def mask = new byte[32]
            new SecureRandom().nextBytes(master)
            new SecureRandom().nextBytes(mask)
            keyFile.parentFile.mkdirs()
            keyFile.bytes = master
            def source = new File(keySource, 'com/shilapi/xcertplay/e01goc/BluetoothAssetKey.java')
            source.parentFile.mkdirs()
            def left = mask.collect { (int) it }.join(',')
            def right = (0..<32).collect { (int) ((byte) (master[it] ^ mask[it])) }.join(',')
            source.text = """package com.shilapi.xcertplay.e01goc;
// Generated local build input. Do not commit or distribute this source.
final class BluetoothAssetKey {
  static byte[] material() {
    byte[] left = new byte[]{${left}};
    byte[] right = new byte[]{${right}};
    for (int i=0; i<left.length; i++) left[i] = (byte)(left[i] ^ right[i]);
    java.util.Arrays.fill(right, (byte)0);
    return left;
  }
}
"""
            Arrays.fill(mask, (byte) 0)
        } else {
            master = keyFile.bytes
            if (master.length != 32) throw new GradleException('Invalid local Bluetooth build key')
        }
        def signer = 'db0dc2a34dc06f22db7a3d10103fa011167712ebe61985ca2103084ff542cb82'
        def context = ('DiPlay Bluetooth v1\u0000' + signer + '\u0000' + asset).getBytes('UTF-8')
        def digest = MessageDigest.getInstance('SHA-256')
        digest.update(master)
        def key = digest.digest(context)
        Arrays.fill(master, (byte) 0)
        def packed = new ByteArrayOutputStream()
        new GZIPOutputStream(packed).withCloseable { it.write(input.bytes) }
        def nonce = new byte[12]
        new SecureRandom().nextBytes(nonce)
        def cipher = Cipher.getInstance('AES/GCM/NoPadding')
        cipher.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(key, 'AES'), new GCMParameterSpec(128, nonce))
        cipher.updateAAD(context)
        destination.withOutputStream {
            it.write('DPG1'.getBytes('US-ASCII')); it.write(nonce); it.write(cipher.doFinal(packed.toByteArray()))
        }
        Arrays.fill(key, (byte) 0)
    }
}
if (isCommon) {
    android.sourceSets.main.assets.srcDir(generated.get().asFile)
    android.sourceSets.main.java.srcDir(keySource)
} else {
    ['e01', 'e01Licensed'].each { android.sourceSets.maybeCreate(it).assets.srcDir(generated.get().asFile) }
}
tasks.named('preBuild').configure { dependsOn(seal) }
tasks.matching { it.name == 'rejectBundledCredentials' }.configureEach { dependsOn(seal) }
