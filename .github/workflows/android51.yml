name: Android 5.1 E01 checks
on:
  push:
    branches: [android51-e01, 'sync/carlito-*']
  pull_request:
    branches: [android51-e01]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android51-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reject credentials and distribution files in source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, API compatibility and source-only E01 APK
        run: >-
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest
          :shared:lintDebug :common:lintDebug
          :mobile:lintE01 :mobile:assembleE01
          -I scripts/android51-api-lint.init.gradle --stacktrace
      - name: Verify Android 5.1 APK and absence of private authentication assets
        shell: bash
        run: |
          set -euo pipefail
          apk=mobile/build/outputs/apk/e01/mobile-e01.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -Fx "sdkVersion:'22'"
          python3 scripts/check_source_apk.py "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: source-only-e01
          path: |
            mobile/build/outputs/apk/e01/*.apk
          if-no-files-found: error
      - name: Validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android51-validation
          path: |
            shared/build/reports/
            common/build/reports/
            mobile/build/reports/
