name: Android 5.1 E01 checks
on:
  push:
    branches: [main, 'sync/original-*', 'sync/geely-*', 'refactor/*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android51-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DIPLAY_WORKERS_VECTOR: ${{ github.workspace }}/../diplay-worker-vector.json
      DIPLAY_LICENSE_PREVIEW: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Reject credentials and distribution files in source
        run: python3 scripts/check_public_tree.py
      - name: Enforce Geely-only vehicle integrations
        run: python3 scripts/check_geely_scope.py
      - name: Maintenance workflow regression tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline activation issuer tests
        run: |
          python -m pip install -r offline-license/requirements.txt
          python -m unittest discover -s offline-license -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: license-workers/package-lock.json
      - name: Workers D1 integration and upload bundle validation
        working-directory: license-workers
        run: |
          npm ci
          npm test
          npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, API compatibility and both source-only E01 variants
        run: >-
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest
          :shared:lintDebug :common:lintDebug
          :mobile:lintE01 :mobile:assembleE01 :mobile:lintE01Public :mobile:assembleE01Public
          :mobile:lintE01Licensed :mobile:assembleE01Licensed
          -I scripts/android51-api-lint.init.gradle --stacktrace
      - name: Verify Android 5.1 APK and absence of private authentication assets
        shell: bash
        run: |
          set -euo pipefail
          apk=mobile/build/outputs/apk/e01/mobile-e01.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -Fx "sdkVersion:'22'"
          python3 scripts/check_source_apk.py "$apk"
          public_apk=mobile/build/outputs/apk/e01Public/mobile-e01Public.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$public_apk" | grep -Fx "sdkVersion:'22'"
          python3 scripts/check_source_apk.py "$public_apk"
          python3 scripts/check_public_release_apk.py "$public_apk" mobile/build/outputs/mapping/e01Public/mapping.txt
          python3 scripts/check_source_apk.py mobile/build/outputs/apk/e01Licensed/mobile-e01Licensed.apk
      # APKs remain ephemeral validation outputs; public artifacts contain reports only.
      - name: Validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android51-validation
          path: |
            shared/build/reports/
            common/build/reports/
            mobile/build/reports/
