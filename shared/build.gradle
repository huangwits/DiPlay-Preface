plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 22
        targetSdk = 37

        ndk {
            // Include x86 so Android 4.3 x86 emulator builds can load both JNI libraries.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-22'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    compileOnly libs.androidx.annotation
    implementation libs.bouncycastle
    implementation libs.concentus
    // Vendored JmDNS 3.6.3 with the Android multicast-socket ordering/API-18 fixes.
    api project(':jmdns')
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
